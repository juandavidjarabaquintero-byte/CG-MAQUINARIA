<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero de Maquinaria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maquinaria">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar de módulos desplegables + panel de trabajo; en móvil el menú es un cajón y hay botón flotante de registro */
:root{
  --bg:#0a0f2e; --bg2:#0e1540; --panel:#131b4d; --panel2:#19235e; --line:#28357a; --line2:#34439a;
  --fg:#e9edff; --mut:#93a0d6; --dim:#6773ad;
  --cyan:#2ee6f0; --teal:#24d6a5; --violet:#7b6dff; --gold:#f2c75c; --warn:#ffad4d; --bad:#ff5c7c; --ok:#24d6a5;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#1d2577 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#13205e 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:linear-gradient(180deg,#121a4f 0%,#0d1440 100%);border-right:1px solid var(--line);padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand .mk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--cyan);display:grid;place-items:center;box-shadow:0 0 18px #2ee6f055 inset,0 0 12px #2ee6f033}
.brand b{font:700 15px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;display:block}
.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 10px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--fg);font:600 12.5px/1.2 var(--f-disp);letter-spacing:.07em;text-transform:uppercase}
.nv svg{flex:none;width:19px;height:19px;stroke:var(--mut)}
.nv .chev{margin-left:auto;width:15px;height:15px;transition:transform .2s}
.nv[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nv:hover{background:#ffffff0a}
.nv.on{background:linear-gradient(90deg,#2ee6f022,#2ee6f005);box-shadow:inset 2px 0 0 var(--cyan)}
.nv.on svg{stroke:var(--cyan)}
.subs{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px 40px}
.subs[hidden]{display:none!important}
.sb{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;color:var(--mut);font-size:13.5px;font-weight:500}
.sb:hover{color:var(--fg);background:#ffffff08}
.sb.on{color:var(--cyan);background:#2ee6f012}
.side-foot{margin-top:auto;border:1px solid var(--line2);border-radius:var(--r);padding:14px;background:linear-gradient(160deg,#1d2a78,#141c55);display:grid;gap:8px}
.side-foot .lbl{font:600 10.5px var(--f-disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.side-foot .big{font:700 22px var(--f-disp);font-variant-numeric:tabular-nums}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:#0a0f2ee6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ham{display:none;border:1px solid var(--line2);background:var(--panel);border-radius:10px;width:40px;height:40px;place-items:center}
.ham svg{width:20px;height:20px;stroke:var(--fg)}
.crumb{min-width:0}
.crumb small{display:block;color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.crumb h1{margin:0;font:700 19px/1.2 var(--f-disp);letter-spacing:.03em;text-wrap:balance;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.pill.sync .dot{background:var(--cyan);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.view{padding:22px max(18px,env(safe-area-inset-right,0px)) 110px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
/* Cards & KPIs */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font:600 12px var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font:500 12px var(--f-body)}
.kpi{position:relative;overflow:hidden}
.kpi .l{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font:700 25px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:linear-gradient(90deg,var(--c,var(--cyan)),transparent);opacity:.85}
.c-cy{--c:var(--cyan)}.c-te{--c:var(--teal)}.c-vi{--c:var(--violet)}.c-go{--c:var(--gold)}.c-ba{--c:var(--bad)}.c-wa{--c:var(--warn)}
.pos{color:var(--teal)}.neg{color:var(--bad)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn:hover{border-color:var(--cyan)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:linear-gradient(90deg,#16b9c8,#5c62ff);border-color:transparent;color:#fff;box-shadow:0 4px 18px #2ee6f033}
.btn.gh{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.dan{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--mut)}
.chip.on{color:#05202a;background:var(--cyan);border-color:var(--cyan)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:#ffffff10;color:var(--mut);white-space:nowrap}
.tag.gasto{background:#ff5c7c1f;color:#ff8ea4}.tag.costo{background:#ffad4d1f;color:#ffc27e}.tag.inversion{background:#7b6dff26;color:#b0a8ff}.tag.ingreso{background:#24d6a51f;color:#5fe8c2}.tag.anticipo{background:#2ee6f01a;color:#7cf0f6}
.tag.ok{background:#24d6a51f;color:#5fe8c2}.tag.wa{background:#ffad4d1f;color:#ffc27e}.tag.ba{background:#ff5c7c1f;color:#ff8ea4}
.search{flex:1;min-width:160px;max-width:320px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:9px 12px}
/* Tables */
.tw{overflow-x:auto;border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font:600 10.5px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid #ffffff0d;vertical-align:top}
.t tr.rw:hover td{background:#ffffff06}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.t .acts{white-space:nowrap;text-align:right}
.ib{border:0;background:transparent;padding:5px;border-radius:7px;color:var(--mut)}
span.ib{display:inline-flex;vertical-align:middle;cursor:help}
td.acts{white-space:nowrap}
.ib svg{width:17px;height:17px;stroke:currentColor;display:block}
.ib:hover{color:var(--cyan);background:#ffffff0c}
.ib.dan:hover{color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
/* Person / entity cards */
.ent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ec{background:linear-gradient(165deg,#1b2564,#141c52);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.ec .hd{display:flex;align-items:flex-start;gap:10px}
.ec .hd b{font-weight:700;font-size:14.5px;line-height:1.25}
.ec .hd small{display:block;color:var(--mut);font-size:12px}
.ec .hd .tag{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ec .bar{gap:6px}
.meter{height:6px;border-radius:9px;background:#ffffff12;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--cyan))}
/* Rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.ring{display:grid;justify-items:center;gap:6px;text-align:center}
.ring svg{width:92px;height:92px}
.ring b{font-size:12.5px;font-weight:600}
.ring small{color:var(--mut);font-size:11.5px;font-family:var(--f-mono)}
/* Alerts */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:13.5px}
.al:last-child{border-bottom:0}
.al i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.al.ba i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.al.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font:11px var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:#04071acc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:linear-gradient(170deg,#1b2566,#121a4c);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 60px #0008,0 0 0 1px #2ee6f011}
.sheet .sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px;background:#1a2463f2;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font:700 16px var(--f-disp);letter-spacing:.04em}
.sheet .sh .ib{margin-left:auto}
.sheet .sbd{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sheet .sft{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:#141c52f2;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:11px 12px;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan);outline:0;box-shadow:0 0 0 3px #2ee6f022}
.fld .hint{font-size:12px;color:var(--dim)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:500 13.5px var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg)}
.checks input{width:auto;accent-color:var(--cyan)}
.prev{border:1px dashed var(--line2);border-radius:12px;padding:12px;background:#0a0f2e80}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.viewer img{width:100%;border-radius:10px}
/* Quick FAB */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#19c9d6,#6a5cff);box-shadow:0 8px 28px #2ee6f055;display:none;place-items:center}
.fab svg{width:26px;height:26px;stroke:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.qgrid h4{grid-column:1/-1;margin:8px 0 0;font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#1d2a78;border:1px solid var(--cyan);color:var(--fg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px)}
.scrim{display:none}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--violet);padding:4px 0 4px 12px}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hstat{display:flex;gap:18px;flex-wrap:wrap}
.hstat div{display:grid}
.hstat small{color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.hstat b{font:700 18px var(--f-disp);font-variant-numeric:tabular-nums}
.ac{background:linear-gradient(165deg,#1b2564,#141c52);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;min-width:0}
.ac-ph,.hero,.avatar{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#2a3a9a 0%,#141c52 65%)}
.ac-ph{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;cursor:pointer}
.ac-ph img,.hero img,.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.ac-ph img:not([src]),.hero img:not([src]),.avatar img:not([src]){display:none}
.ac-ph:hover img{transform:scale(1.04)}
.phc{position:absolute;inset:0;display:grid;place-items:center}
.phc svg{width:46px;height:46px;stroke:#2ee6f099}
img[src]~.phc{display:none}
.ac-ph::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,#0a0f2ed9);pointer-events:none}
.ac-ph .badge{position:absolute;left:10px;bottom:10px;z-index:1;max-width:calc(100% - 20px)}
.ac-ph .badge .tag{white-space:normal;text-align:left}
.ac-bd{padding:14px;display:grid;gap:8px;min-width:0}
.ac-bd .hd b{font-weight:700;font-size:15px}
.ac-bd .hd small{display:block;color:var(--mut);font-size:12.5px}
.hero{width:100%;max-width:100%;aspect-ratio:16/9;max-height:340px;border-radius:14px}
.hero .phc svg{width:72px;height:72px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px;background:linear-gradient(transparent,#0a0f2ef2 70%);display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hero .cap b{display:block;font:700 22px/1.2 var(--f-disp);letter-spacing:.02em}
.hero .cap .btn{margin-left:auto}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;border:1.5px solid var(--cyan);padding:0;cursor:pointer}
.hero.mqh{display:block;aspect-ratio:21/9;max-height:260px;border:0;padding:0;margin:0 0 14px;cursor:zoom-in;border-radius:14px}
.mqtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.mqtabs::-webkit-scrollbar{display:none}.mqtabs .chip{flex:none}
.avatar .phc svg{width:24px;height:24px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.sheet.wide{width:min(780px,100%)}
.sbd h3.sec{margin:0 0 4px;font:600 12px var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.obl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid #ffffff0f}
.obl:last-child{border-bottom:0}
.obl .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;text-align:left}
.prev .tag{margin-right:6px}
.chart.wide svg{max-height:360px}
.cols2{columns:2 320px;column-gap:28px}
.cols2>div{break-inside:avoid}
.dl{display:inline-block;margin-left:8px;font:700 12px var(--f-body);color:var(--mut);vertical-align:4px}
.dl.up{color:var(--teal)}.dl.dn{color:var(--bad)}
.al.in i{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
table.pyg tr.sub td{font-weight:700}
table.pyg tr.total td{font-weight:800;border-top:1px solid var(--line2);background:#2ee6f00d}
table.pyg tr.nota td{color:var(--mut);font-style:italic}
.donut{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:center;justify-items:center}
.donut .dlist{justify-self:stretch}
.donut svg{width:100%;height:auto;max-width:220px}
.dlist{display:grid;gap:7px;min-width:0}
.dlist div{display:grid;grid-template-columns:10px minmax(70px,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.dlist i{width:10px;height:10px;border-radius:3px}
.dlist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist b{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.dlist small{color:var(--mut);font-family:var(--f-mono);min-width:34px;text-align:right}
.hb{display:grid;gap:5px;margin-bottom:12px;font-size:13.5px}

const lastRetroCorte=mid=>LM('rcort',mid??curMq().id).map(r=>r.fecha).sort().pop()||'';
function anticiposPend(perId,exclCorte){
 const ant=sum(L('mov').filter(r=>r.p==='mina'&&r.s==='nomina'&&r.per===perId&&r.nat==='anticipo'));
 const desc=sum(L('cortes').filter(c=>c.id!==exclCorte).flatMap(c=>c.liq||[]).filter(x=>x.per===perId),x=>x.desc);
 return Math.max(0,ant-desc);
}
function minaCostos(f,t){return sum(L('mov').filter(r=>r.p==='mina'&&r.nat==='costo'&&inP(r.fecha,f,t)))+retroCalc(f,t).costoMina}
function minaPendiente(exclCorte){return Math.max(0,minaCostos()-sum(L('cortes').filter(c=>c.id!==exclCorte),c=>c.abono))}
function reparto(total,g,partIds,exclCorte){
 const pc=S.cfg.pct;const inv=100-pc.ter-pc.emp-pc.com-pc.adm;
 const per=L('per').filter(p=>p.sc==='mina'&&!p.inactivo);
 const one=r=>per.find(p=>p.rol===r);
 const lines=[];
 const push=(key,label,pct,p)=>{const cop=total*pct/100,gr=g*pct/100;const d=p?Math.min(cop,anticiposPend(p.id,exclCorte)):0;lines.push({key,label,pct,per:p?.id||'',nombre:p?.nombre||'',g:gr,cop,desc:d,neto:cop-d})};
 push('ter','Dueño del terreno',pc.ter,one('Dueño del terreno'));
 const emps=per.filter(p=>p.rol==='Empleado directo'&&partIds.includes(p.id));
 if(emps.length)emps.forEach(p=>push('emp','Empleado directo',pc.emp/emps.length,p));else push('emp','Empleados directos (sin asignar)',pc.emp,null);
 push('com','Comisionista',pc.com,one('Comisionista'));
 push('adm','Administrador',pc.adm,one('Administrador'));
 lines.push({key:'inv',label:'Dueño de la mina (inversionista)',pct:inv,per:'',nombre:'',g:g*inv/100,cop:total*inv/100,desc:0,neto:total*inv/100});
 return lines;
}
function report(f,t){
 const M=L('mov').filter(r=>inP(r.fecha,f,t));
 const agg=a=>({gas:sum(a.filter(r=>r.nat==='gasto')),cos:sum(a.filter(r=>r.nat==='costo')),inv:sum(a.filter(r=>r.nat==='inversion')),ant:sum(a.filter(r=>r.nat==='anticipo'))});
 const subs=(a,p)=>{const o={};a.filter(r=>r.nat!=='anticipo').forEach(r=>{const k=subOf(p,r.s)?.name||r.s;o[k]=(o[k]||0)+r.valor});return o};
 const rows=[];
 const mk=(id,name,a,p)=>{const x=Object.assign({id,name,ing:0,subs:subs(a,p),n:a.length},agg(a));rows.push(x);return x};
 mk('personal','Gastos personales',M.filter(r=>r.p==='personal'),'personal');
 mk('parcela','Parcela Las Colinas',M.filter(r=>r.p==='parcela'),'parcela');
 L('inm').forEach(i=>{const x=mk('inm:'+i.id,i.nombre,M.filter(r=>r.p==='inm'&&r.inm===i.id),'inm');x.pres=i.pres});
 const sinInm=M.filter(r=>r.p==='inm'&&!L('inm').some(i=>i.id===r.inm));if(sinInm.length)mk('inm:?','Inmuebles (sin asignar)',sinInm,'inm');
 const mn=mk('mina','Mina La Fe',M.filter(r=>r.p==='mina'),'mina');
 const rc=retroCalc(f,t);mn.cos+=rc.costoMina;mn.subs['Maquinaria (renta, combustible y repuestos)']=rc.costoMina;mn.retro=rc;
 const cs=L('cortes').filter(c=>inP(c.fecha,f,t));mn.ing=sum(cs,c=>c.invCop);mn.oroG=sum(cs,c=>c.gramos);mn.bruto=sum(cs,c=>c.total);mn.cortes=cs.length;
 rows.forEach(r=>{r.util=r.ing-r.gas-r.cos;r.egr=r.gas+r.cos+r.inv});
 mn.rent=(mn.cos+mn.inv)?mn.util/(mn.cos+mn.inv)*100:0;
 const T={ing:sum(rows,r=>r.ing),gas:sum(rows,r=>r.gas),cos:sum(rows,r=>r.cos),inv:sum(rows,r=>r.inv)};T.util=T.ing-T.gas-T.cos;T.egr=T.gas+T.cos+T.inv;
 const pr={col:sum(L('prest').filter(r=>inP(r.fecha,f,t))),rec:sum(L('abonos').filter(r=>inP(r.fecha,f,t))),saldo:sum(L('prest'))-sum(L('abonos'))};
 return {rows,T,pr,M};
}

const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MESU=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fdl=s=>{if(!s)return '';const d=new Date(s+'T12:00:00');return `${DIAS[d.getDay()]} ${s.slice(8,10)} ${MESU[+s.slice(5,7)-1]} ${s.slice(2,4)}`};
const fds=s=>s?`${s.slice(8,10)} ${MESU[+s.slice(5,7)-1]} ${s.slice(2,4)}`:'';
const enCurso=r=>r.hf===''||r.hf==null;
const f1=n=>(+n||0).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});
const JC={ok:'#1fe0a0',cerca:'#ffb547',bajo:'#ff4f73',sin:'#8b93b5',curso:'#8b7bff'};
function jst(r){const P=mqById(mqOf(r));if(enCurso(r))return 'curso';if(!(r.horas>0))return 'sin';if(r.horas>=P.min)return 'ok';if(r.horas>=P.min*(P.alerta||80)/100)return 'cerca';return 'bajo'}
function hoursChart(h,P){
 P=P||curMq();const d=h.filter(r=>!enCurso(r)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-21);
 if(!d.length)return '<div class="empty">Sin jornadas registradas.</div>';
 const W=640,H=240,pl=8,pr=8,pt=26,pb=34;const mx=Math.max(P.min*1.45,...d.map(r=>r.horas))*1.04;const bw=(W-pl-pr)/Math.max(d.length,8);const x0=pl+((W-pl-pr)-bw*d.length)/2;const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimiento diario de la máquina"><defs><filter id="glw" x="-50%" y="-20%" width="200%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 d.forEach((r,i)=>{const st=jst(r);const x=x0+i*bw+bw*.12,w=bw*.76;const hh=Math.max(0,y(0)-y(r.horas));if(r.horas>0)s+=`<path d="M${x},${y(0)} V${y(r.horas)+6} q0,-6 6,-6 H${x+w-6} q6,0 6,6 V${y(0)}Z" fill="${JC[st]}" filter="url(#glw)" opacity=".95"><title>${fdl(r.fecha)}: ${f1(r.horas)} h${r.obs?' · '+esc(r.obs):''}</title></path>`;else s+=`<rect x="${x}" y="${y(0)-3}" width="${w}" height="3" rx="1.5" fill="${JC.sin}" opacity=".6"><title>${fdl(r.fecha)}: sin operación${r.obs?' · '+esc(r.obs):''}</title></rect>`;hh});
 s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(P.min)}" y2="${y(P.min)}" stroke="#93a0d6" stroke-opacity=".55" stroke-dasharray="5 5"/><text x="${W-pr}" y="${y(P.min)-7}" text-anchor="end" style="fill:#93a0d6;font:500 13px var(--f-body)">Mín ${fg(P.min)} h</text>`;
 s+=`<text x="${pl}" y="${H-8}" style="fill:#93a0d6;font:500 13px var(--f-body)">${fds(d[0].fecha)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" style="fill:#93a0d6;font:500 13px var(--f-body)">${fds(d[d.length-1].fecha)}</text></svg>`;
 const cnt=k=>d.filter(r=>jst(r)===k).length;const nov=d.filter(r=>r.obs).length;
 return `<div class="chart">${s}</div><div class="lg2"><span><i style="background:${JC.ok}"></i>Meta cumplida ${cnt('ok')}</span><span><i style="background:${JC.cerca}"></i>Cerca ${cnt('cerca')}</span><span><i style="background:${JC.bajo}"></i>Bajo mínimo ${cnt('bajo')}</span><span><i style="background:${JC.sin}"></i>Sin operación ${cnt('sin')}</span><span><i style="background:#ffb547"></i>Con novedad ${nov}</span></div>`;
}

function ringSvg(p,c1,c2,label){

}
function monthSeries(n=6){
 const out=[];const d=new Date();d.setDate(1);
 for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');const f=k+'-01',t=k+'-31';
  const m=L('mov').filter(r=>r.fecha.startsWith(k)&&r.nat!=='anticipo');const rc=retroCalc(f,t);
  out.push({k,lab:MES[x.getMonth()],egr:sum(m)+rc.costoMina,ing:sum(L('cortes').filter(c=>c.fecha.startsWith(k)),c=>c.invCop)})}

function monthChart(s){
 const W=640,H=220,pl=56,pb=26,pt=12;const mx=Math.max(1,...s.map(x=>Math.max(x.egr,x.ing)))*1.12;const bw=(W-pl-10)/s.length;
 const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Egresos e ingresos por mes"><defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b6dff"/><stop offset="1" stop-color="#2ee6f0" stop-opacity=".35"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24d6a5" stop-opacity=".35"/><stop offset="1" stop-color="#24d6a5" stop-opacity="0"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const v=mx/4*i;o+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`}
 s.forEach((x,i)=>{const cx=pl+i*bw+bw/2;o+=`<rect x="${cx-bw*.26}" y="${y(x.egr)}" width="${bw*.52}" height="${Math.max(0,y(0)-y(x.egr))}" rx="4" fill="url(#gm)"><title>${x.lab}: egresos ${fmt(x.egr)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle">${x.lab}</text>`});
 const pts=s.map((x,i)=>[pl+i*bw+bw/2,y(x.ing)]);
 o+=`<path d="M${pts[0][0]},${y(0)} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(0)}Z" fill="url(#ga)"/><path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')}" fill="none" stroke="#24d6a5" stroke-width="2.5"/>`;
 pts.forEach((p,i)=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="#0a0f2e" stroke="#24d6a5" stroke-width="2.5"><title>${s[i].lab}: ingresos ${fmt(s[i].ing)}</title></circle>`);
 return `<div class="chart">${o}</svg></div><div class="legend" style="margin-top:8px"><span><i style="background:#7b6dff"></i>Egresos (gastos, costos e inversiones)</span><span><i style="background:#24d6a5"></i>Ingresos por oro (inversionista)</span></div>`;
}
function alerts(){
 const a=[];const t=today(),lim=addDays(t,30);
 L('obl').filter(o=>!o.done&&assetOf(o)&&!assetOf(o).del).sort((x,z)=>x.fecha.localeCompare(z.fecha)).forEach(o=>{const n=ASSET[o.ac].name(assetOf(o));if(o.fecha<t)a.push(['ba',`${n}: ${oblName(o)} vencido desde ${fd(o.fecha)}.`]);else if(o.fecha<=lim)a.push(['',`${n}: ${oblName(o)} vence el ${fd(o.fecha)}.`])});
 L('veh').forEach(v=>['SOAT','Revisión técnico-mecánica'].forEach(tp=>{const o=L('obl').find(o=>o.aid===v.id&&o.tipo===tp&&!o.done);if(!o||o.est)a.push(['',`${v.placa}: ${o?'confirma':'registra'} la fecha de ${tp==='SOAT'?'vencimiento del SOAT':'la revisión técnico-mecánica'} en la ficha del vehículo.`])}));
 mqList().filter(m=>!m.inactivo).forEach(m=>{const {f}=retroPeriodo(m.id);const R=retroCalc(f,'',m.id);if(R.bajo)a.push(['',`${m.maq}: ${R.bajo} días por debajo de ${fg(m.min)} horas en el periodo actual.`]);const op=LM('rh',m.id).filter(enCurso);if(op.length&&op[0].fecha<addDays(today(),-1))a.push(['',`${m.maq}: la jornada del ${fd(op[0].fecha)} sigue en curso. Ciérrala con el horómetro final.`])});
 if(srvOld()&&['admin','aux'].includes(S.cfg.tokRole))a.unshift(['ba','El servicio de Apps Script está desactualizado: algunos datos no se guardan en el Sheet. Pega el Code.gs más reciente y crea una nueva versión de la implementación.']);
 a.push(...fAlerts());
 const ant=sum(L('per').filter(p=>p.sc==='mina'),p=>anticiposPend(p.id));if(ant)a.push(['',`Mina: ${fmt(ant)} en anticipos por descontar en el próximo corte.`]);
 const pend=minaPendiente();if(pend)a.push(['ba',`Mina: ${fmt(pend)} en costos aún sin cubrir con cortes de oro.`]);
 L('inm').forEach(i=>{const ej=sum(L('mov').filter(r=>r.p==='inm'&&r.inm===i.id));if(i.pres&&ej>i.pres*.9)a.push([ej>i.pres?'ba':'',`${i.nombre}: ejecutado ${(ej/i.pres*100).toFixed(0)}% del presupuesto.`])});
 if(S.outbox.length)a.push(['',`${S.outbox.length} cambios guardados en este equipo esperan sincronizar con Drive.`]);
 return a;
}

let FORM=null;let FICHA=null;
function openForm(o){
 if(FICHA&&!o.back){const fb=FICHA;o.back=()=>openFicha(fb.c,fb.id)}FICHA=null;$('#sheet').classList.remove('wide');
 FORM=o;

  else if(f.t==='area')inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.t==='photo')inp=`<div class="photo"><img class="thumb" id="${id}_t" alt="" ${o.rec?.[f.k]?`data-fid="${esc(o.rec[f.k])}"`:'hidden'}><label class="btn sm" for="${id}">${ic('cam')}${o.rec?.[f.k]?(f.img?'Cambiar foto':'Cambiar soporte'):(f.img?'Tomar o elegir foto':'Foto o archivo del soporte')}</label><input type="file" id="${id}" accept="${f.img?'image/*':'image/*,application/pdf'}" hidden><span class="mut" id="${id}_n">${f.img?'':esc(o.rec?.fotoN||'')}</span></div>`;
  else if(f.t==='checks')inp=`<div class="checks" id="${id}">${f.opts.map(([val,lab])=>`<label><input type="checkbox" value="${esc(val)}" ${(v||[]).includes(val)?'checked':''}>${esc(lab)}</label>`).join('')}</div>`;
  else if(f.t==='html')return `<div class="fld w" id="${id}">${f.html}</div>`;
  else inp=`<input id="${id}" type="${f.t||'text'}" ${f.t==='text'||!f.t?'autocomplete="off"':''} placeholder="${esc(f.ph||'')}" value="${esc(v)}" ${f.req?'required':''} ${f.list?`list="${id}_l"`:''}>${f.list?`<datalist id="${id}_l">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  return `<div class="fld ${f.w?'w':''}" id="w_${f.k}"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`};
 $('#sheet').innerHTML=`<div class="sh"><h2>${esc(o.title)}</h2><button class="ib" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
 <form id="frm" novalidate><div class="sbd">${o.top||''}<div class="fg">${o.fields.map(fld).join('')}</div>${o.preview?'<div class="prev" id="prev"></div>':''}</div>
 <div class="sft"><button type="button" class="btn gh" data-act="close">Cancelar</button><button type="submit" class="btn pri">${esc(o.ok||'Guardar')}</button></div></form>`;
 $('#modal').hidden=false;
 const frm=$('#frm');
 frm.addEventListener('submit',async e=>{e.preventDefault();if(frm.dataset.busy)return;const vals=readForm();const miss=o.fields.find(f=>f.req&&(!f.when||f.when(vals))&&(vals[f.k]===''||vals[f.k]==null||(['money','dec'].includes(f.t)&&!vals[f.k])));
  if(miss){toast('Falta: '+miss.l.replace(/ \*$/,''));$('#f_'+miss.k)?.focus();return}
  frm.dataset.busy='1';const sb=frm.querySelector('button[type=submit]');if(sb)sb.disabled=true;
  const unbusy=()=>{delete frm.dataset.busy;if(sb)sb.disabled=false};
  for(const ph of o.fields.filter(f=>f.t==='photo')){const fi=$('#f_'+ph.k);if(fi.files[0]){try{const fid=uid();const data=await compress(fi.files[0]);const rec={name:fi.files[0].name,data};await DB.put('files',fid,rec);IMG[fid]=rec;vals[ph.k]=fid;const sfx=ph.k.slice(4);vals['fotoDrive'+sfx]='';vals['fotoUrl'+sfx]='';if(!ph.img)vals['fotoN'+sfx]=fi.files[0].name}catch(err){toast('No se pudo leer el archivo')}}else{delete vals[ph.k]}}
  let msg;try{msg=o.save(vals)}catch(err){unbusy();toast('No se pudo guardar: '+(err.message||err));return}
  if(msg===false){unbusy();return}const back=o.back;closeModal();render();if(back)back();toast(msg||'Guardado')});
  const vis=()=>{const v=readForm();o.fields.forEach(f=>{if(f.when){const w=$('#w_'+f.k);if(w)w.hidden=!f.when(v)}})};
 frm.addEventListener('input',e=>{if(e.target.matches('[data-money]'))moneyMask(e.target);vis();if(o.onInput)o.onInput(readForm())});
 frm.addEventListener('change',e=>{if(e.target.type==='file'){const fl=e.target.files[0];const n=$('#'+e.target.id+'_n');if(n&&!/image/.test(fl?.type||'')||n&&!$('#'+e.target.id+'_t'))n.textContent=fl?.name||'';const t=$('#'+e.target.id+'_t');if(t&&fl&&fl.type.startsWith('image/')){t.src=URL.createObjectURL(fl);t.hidden=false;if(n)n.textContent=''}}vis();if(o.onInput)o.onInput(readForm())});
 vis();hydrate($('#sheet'));if(o.onInput)o.onInput(readForm());
 setTimeout(()=>{const first=frm.querySelector('input:not([type=date]):not([type=file]),select');if(first&&window.innerWidth>640)first.focus()},50);

function moneyMask(el){const d=el.value.replace(/\D/g,'');el.value=d?(+d).toLocaleString('es-CO'):''}
function readForm(){const o={};FORM.fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;
 if(f.t==='money')o[f.k]=+(el.value.replace(/\D/g,''))||0;else if(f.t==='dec')o[f.k]=num(el.value);else if(f.t==='checks')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);else if(f.t==='photo'||f.t==='html')o[f.k]=FORM.rec?.[f.k];else o[f.k]=el.value.trim()});return o}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';$('#sheet').classList.remove('wide');FORM=null;FICHA=null}
async function compress(file){
 const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
 if(!file.type.startsWith('image/'))return rd(file);
 const url=URL.createObjectURL(file);
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.72);
}

  {k:'arrTipo',l:'Tipo de inmueble arrendado',t:'select',opts:ARR_T,v:rec.arrTipo||ARR_T[0],when:isArr},
  {k:'arrDesc',l:'Inmueble o dirección',v:rec.arrDesc,ph:'Ej. Apartamento 302, Caucasia',when:isArr},
  {k:'arrMes',l:'Mes que se paga',t:'month',v:rec.arrMes||(rec.fecha||today()).slice(0,7),when:isArr},
  {k:'concepto',l:'Concepto',v:rec.concepto,req:1,ph:'Qué se compró o pagó'},
  {k:'tercero',l:sub?.tl||(isArr(rec)?'Arrendador':'Proveedor / beneficiario'),v:rec.tercero,list:tercs},{k:'cedula',l:'Cédula o NIT',v:rec.cedula,ph:'Opcional'},
  {k:'pago',l:'Forma de pago',t:'select',opts:PAGOS,v:rec.pago||'Efectivo'},{k:'resp',l:'Responsable',v:rec.resp,ph:'Quién lo registró o pagó'});
 const fopts=L('fnd').filter(f=>fFor(f,m,rec.inm||extra.inm||V.inm)&&(!f.inactivo||f.id===rec.fnd));
 const hasF=fopts.length||rec.fnd||extra.fnd;
 if(hasF)fields.splice(2,0,{k:'fnd',l:'Pagado con',t:'select',blank:'Pago directo',opts:fopts.map(f=>[f.id,(isProv(f)?'Anticipo en ':'Fondo de ')+f.nombre+' · saldo '+fmt(fStats(f).saldo-(rec.fnd===f.id?(rec.valor||0)*-1:0))]),v:rec.fnd||extra.fnd||'',w:1,hint:'Si lo compró el encargado con el recurso entregado, o se retiró del anticipo en el proveedor.'});

 save:v=>{

   if(o)upsert('obl',{id:o.id,fecha:vence,est:false,hist:(o.hist||[]).concat([{fecha:d.fecha,mov:r.id,valor:d.valor,foto:d.foto||'',nota:d.nota||''}])});

 try{const file=new File([blob],name,{type:blob.type});if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}

function stackSvg(ys,pal=PAL_D){

 const mx=Math.max(1,...ys.map(m=>Math.max(sum(m.proj,p=>p.egr),m.ing)))*1.08;const bw=(W-pl-8)/12;const y=v=>pt+(H-pt-pb)*(1-v/mx);

 for(let i=0;i<=4;i++){const v=mx/4*i;s+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="${pal.grid}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${pal.txt}">${fmtK(v)}</text>`}
 ys.forEach((m,i)=>{let acc=0;const x=pl+i*bw+bw*.2,w=bw*.6;ids.forEach(id=>{const p=m.proj.find(q=>q.id===id);const v=p?p.egr:0;if(!v)return;s+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(0,y(acc)-y(acc+v))}" fill="${pcol(id)}" fill-opacity=".9"><title>${m.lab} · ${esc(p.name)}: ${fmt(v)}</title></rect>`;acc+=v});
  s+=`<text x="${x+w/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="${pal.txt}">${m.lab}</text>`});

 pts.forEach((p,i)=>{if(ys[i].ing)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${pal.bg}" stroke="${pal===PAL_D?'#e9edff':'#0e1540'}" stroke-width="2"><title>${ys[i].lab}: ingresos ${fmt(ys[i].ing)}</title></circle>`});

function donutSvg(items,pal=PAL_D){

  if(da>=Math.PI*2-1e-6)s+=`<circle cx="${cx}" cy="${cy}" r="${(R0+R1)/2}" fill="none" stroke="${cols[i%cols.length]}" stroke-width="${R0-R1}"/>`;
  else s+=`<path d="M${x1},${y1} A${R0},${R0} 0 ${lg} 1 ${x2},${y2} L${x3},${y3} A${R1},${R1} 0 ${lg} 0 ${x4},${y4}Z" fill="${cols[i%cols.length]}"><title>${esc(it.l)}: ${fmt(it.v)}</title></path>`;a=a2;it.col=cols[i%cols.length]});

}
function catItems(R,max=7){const g={};catBreak(R).filter(x=>x.n!=='inversion').forEach(x=>g[x.c]=(g[x.c]||0)+x.v);const arr=Object.entries(g).sort((a,b)=>b[1]-a[1]);const top=arr.slice(0,max).map(([l,v])=>({l,v}));const rest=sum(arr.slice(max),x=>x[1]);if(rest)top.push({l:'Otras',v:rest});return top}

 if(st==='num'){const jor=WZ.type==='jor';const lab=jor?(WZ.op?'¿Qué número marca el horómetro ahora?':'¿Qué número marca el horómetro al empezar?'):'¿Cuántos galones?';const v=d.n??(jor?(WZ.op?'':(WZ.last?.hf??'')):'');
  body=`<p class="wq">${lab}</p><input class="wz-in" id="wzN" inputmode="decimal" autocomplete="off" value="${v===''?'':String(v).replace('.',',')}" placeholder="0">${jor&&WZ.op?`<p class="mut" style="text-align:center">Empezó en ${f1(WZ.op.hi)}</p>`:''}`}
 if(st==='money')body=`<p class="wq">¿Cuánto costó?</p><input class="wz-in" id="wzM" inputmode="numeric" data-money autocomplete="off" value="${d.valor?(+d.valor).toLocaleString('es-CO'):''}" placeholder="$ 0">`;
 if(st==='tipo'){const op=WZ.type==='rs'?[['Repuesto','wrench'],['Reparación','tool'],['Otro','plus']]:[['ACPM','fuel'],['Gasolina','fuel'],['Aceite','fuel'],['Grasa','fuel']];
  body=`<p class="wq">¿Qué fue?</p><div class="wz-ch">${op.map(([o,i])=>`<button class="${d.tipo===o?'on':''}" data-act="wzSet" data-k="tipo" data-v="${o}">${ic(i)}${o}</button>`).join('')}</div>`}
 if(st==='txt')body=`<p class="wq">¿Qué se compró o arregló?</p><input class="wz-in sm" id="wzT" autocomplete="off" value="${esc(d.txt||'')}" placeholder="Ej. manguera, filtro"><div class="wz-chips">${['Manguera','Filtro','Aceite','Llanta','Pasador','Soldadura','Mano de obra'].map(o=>`<button data-act="wzAdd" data-v="${o}">${o}</button>`).join('')}</div>`;
 if(st==='nov'||st==='novq'){if(st==='novq'&&d.hasNov==null)body=`<p class="wq">¿Hubo alguna novedad hoy?</p><div class="wz-ch two"><button data-act="wzSet" data-k="hasNov" data-v="1">${ic('alert')}Sí</button><button data-act="wzSet" data-k="hasNov" data-v="0">${ic('ok')}No</button></div>`;
  else body=`<p class="wq">¿Qué pasó?</p><div class="wz-chips">${['Daño de la máquina','Lluvia','Sin operador','Mantenimiento','Festivo','Sin combustible','No hubo trabajo'].map(o=>`<button data-act="wzAdd" data-v="${o}">${o}</button>`).join('')}</div><textarea class="wz-in sm" id="wzT" rows="3" placeholder="Escribe o toca una opción">${esc(d.txt||'')}</textarea>`}
 if(st==='pago'){const fo=wzFundOpts();if(!fo.length){WZ.d.fnd='';WZ.i++;return wzRender()}
  body=`<p class="wq">¿Con qué plata se pagó?</p><div class="wz-ch">${fo.map(f=>`<button class="${d.fnd===f.id?'on':''}" data-act="wzSet" data-k="fnd" data-v="${f.id}">${ic('cash')}${isProv(f)?'Anticipo en '+esc(f.nombre):'Plata entregada a '+esc(f.nombre)}</button>`).join('')}<button class="${d.fnd===''?'on':''}" data-act="wzSet" data-k="fnd" data-v="">${ic('user')}Otra persona pagó</button></div>`}
 if(st==='ok'){const rows=[['Máquina',WZ.m.maq],['Fecha',fdl(d.fecha)]];
  if(WZ.type==='jor')rows.push([WZ.op?'Horómetro final':'Horómetro inicio',f1(d.n)],...(WZ.op?[['Horas',f1(Math.max(0,d.n-WZ.op.hi))]]:[]),...(d.txt?[['Novedad',d.txt]]:[]));
  if(WZ.type==='nov')rows.push(['Novedad',d.txt]);
  if(WZ.type==='rs')rows.push(['Tipo',d.tipo],['Qué',d.txt],['Valor',fmt(d.valor)]);
  if(WZ.type==='rc')rows.push(['Tipo',d.tipo],['Cantidad',f1(d.n)+' gal'],['Valor',fmt(d.valor)]);
  if((WZ.type==='rs'||WZ.type==='rc')&&wzFundOpts().length){const f=byId('fnd',d.fnd);rows.push(['Pagado con',f?f.nombre:'Otra persona'])}
  rows.push(['Foto',d.foto||d.foto2?'Sí':'No']);
  body=`<p class="wq">Revisa y guarda</p><div class="kv wz-kv">${rows.map(([a,b])=>`<span>${esc(a)}</span><span>${esc(String(b??''))}</span>`).join('')}</div><div class="fld" style="margin-top:12px"><label for="wzF">Fecha</label><input type="date" id="wzF" value="${d.fecha}" max="${today()}"></div>`}
 const last=st==='ok';
 $('#sheet').classList.add('wide');$('#sheet').classList.add('wzs');
 $('#sheet').innerHTML=`<div class="sh"><h2>${esc(T)}</h2><button class="ib" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="sbd wz"><div class="wz-dots">${WZ.steps.map((_,j)=>`<i class="${j<=WZ.i?'on':''}"></i>`).join('')}</div>${body}${hint?`<p class="mut" style="text-align:center">${hint}</p>`:''}</div>
 <div class="sft wz-ft">${WZ.i?`<button class="btn gh big" data-act="wzBack">${ic('back')}Atrás</button>`:''}<button class="btn pri big" data-act="${last?'wzSave':'wzNext'}">${last?ic('ok')+'Guardar':'Siguiente'}</button></div>`;
 $('#modal').hidden=false;
 const fi=$('#wzFile');if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{const fid=uid();const data=await compress(f);const rec={name:f.name,data};await DB.put('files',fid,rec);IMG[fid]=rec;WZ.d.foto=fid;wzRender()}catch(e){toast('No se pudo guardar la foto')}};
 const mi=$('#wzM');if(mi)mi.oninput=()=>moneyMask(mi);
 const fi2=$('#wzN')||$('#wzM')||$('#wzT');if(fi2&&!('ontouchstart' in window))setTimeout(()=>fi2.focus(),60);
}
function wzRead(){const d=WZ.d;const n=$('#wzN');if(n)d.n=num(n.value);const m=$('#wzM');if(m)d.valor=+(m.value.replace(/\D/g,''))||0;const t=$('#wzT');if(t)d.txt=t.value.trim();const f=$('#wzF');if(f&&f.value)d.fecha=f.value}
function wzCheck(){const st=WZ.steps[WZ.i],d=WZ.d;
 if(st==='foto'&&WZ.type==='jor'&&!d.foto){toast('Toma la foto del horómetro');return false}
 if(st==='num'){if(!(d.n>0)&&!(WZ.type==='jor'&&d.n===0)){toast('Escribe el número');return false}if(WZ.type==='jor'&&WZ.op&&d.n<WZ.op.hi){toast('El número es menor que el del inicio ('+f1(WZ.op.hi)+')');return false}}
 if(st==='money'&&!(d.valor>0)){toast('Escribe cuánto costó');return false}
 if(st==='txt'&&!d.txt){toast('Escribe qué se compró');return false}
 if(st==='nov'&&!d.txt){toast('Escribe o toca la novedad');return false}
 if(st==='pago'&&d.fnd==null){toast('Toca una opción');return false}
 return true}
function wzSave(){wzRead();const d=WZ.d,m=WZ.m,src='campo';
 if(WZ.type==='jor'){if(WZ.op){const hf=d.n;upsert('rh',{id:WZ.op.id,hf,horas:Math.round((hf-WZ.op.hi)*100)/100,foto2:d.foto||WZ.op.foto2||'',fotoDrive2:'',fotoUrl2:'',...(d.txt?{obs:(WZ.op.obs?WZ.op.obs+' · ':'')+d.txt}:{}),val:false})}
  else upsert('rh',{fecha:d.fecha,mq:m.id,cli:m.cli||'',tar:m.precio||0,hi:d.n,hf:'',horas:0,operador:m.operador||'',obs:'',foto:d.foto||'',src})}
 if(WZ.type==='nov'){const r=LM('rh',m.id).filter(x=>x.fecha===d.fecha).sort((a,b)=>(enCurso(b)?1:0)-(enCurso(a)?1:0))[0];
  if(r)upsert('rh',{id:r.id,obs:(r.obs?r.obs+' · ':'')+d.txt,...(d.foto?{foto3:d.foto,fotoDrive3:'',fotoUrl3:''}:{}),val:false});
  else{const lh=WZ.last?.hf??0;upsert('rh',{fecha:d.fecha,mq:m.id,cli:m.cli||'',tar:m.precio||0,hi:lh,hf:lh,horas:0,operador:m.operador||'',obs:d.txt,foto3:d.foto||'',src})}}
 if(WZ.type==='rs')upsert('rs',{fecha:d.fecha,mq:m.id,tipo:d.tipo||'Repuesto',concepto:d.txt,valor:d.valor,asume:m.repA||'Dueño',fnd:d.fnd||'',foto:d.foto||'',src});
 if(WZ.type==='rc')upsert('rc',{fecha:d.fecha,mq:m.id,tipo:d.tipo||'ACPM',cant:d.n,und:'gal',valor:d.valor,asume:m.combA||'Dueño',fnd:d.fnd||'',foto:d.foto||'',src});
 WZ=null;closeModal();render();
 const t=$('#toast');toast(S.cfg.url?(navigator.onLine?'Guardado. Enviando…':'Guardado en el celular. Se envía cuando haya señal.'):'Guardado en este celular.');t.classList.add('big');setTimeout(()=>t.classList.remove('big'),3000);
 if(S.cfg.url&&navigator.onLine)setTimeout(()=>sync(false),400);
}
function vMis(){const m=cmq();if(!m)return '';const rows=[...LM('rh',m.id).map(r=>({c:'rh',r,t:enCurso(r)?'Jornada en curso':r.horas>0?'Jornada · '+f1(r.horas)+' h':'Novedad',d:r.obs||'',v:''})),...LM('rs',m.id).map(r=>({c:'rs',r,t:r.tipo+': '+r.concepto,d:'',v:fmt(r.valor)})),...LM('rc',m.id).map(r=>({c:'rc',r,t:r.tipo+(r.cant?' · '+f1(r.cant)+' gal':''),d:'',v:fmt(r.valor)}))].sort((a,b)=>b.r.fecha.localeCompare(a.r.fecha)||(b.r.cre||0)-(a.r.cre||0)).slice(0,40);
 const pend=new Set(S.outbox.map(o=>o.c+':'+o.id));
 $('#sheet').classList.add('wide');
 $('#sheet').innerHTML=`<div class="sh"><h2>Mis registros · ${esc(m.maq)}</h2><button class="ib" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="sbd">${rows.map(x=>`<button class="rl" data-act="edit" data-c="${x.c}" data-id="${x.r.id}"><i class="d" style="color:${pend.has(x.c+':'+x.r.id)?'#ffb547':'#1fe0a0'}"></i><span class="t"><b>${esc(x.t)}</b><small>${fdl(x.r.fecha)}${x.d?' · '+esc(x.d):''} · ${pend.has(x.c+':'+x.r.id)?'por enviar':x.r.val?'validado':'enviado'}</small></span><span class="v">${x.v}</span></button>`).join('')||'<div class="empty">Sin registros.</div>'}</div>`;
 $('#modal').hidden=false;
}
function vValidar(){const p=pendVal();
 return `<div class="card"><h3>Registros por validar<span class="r mut">${p.length}</span></h3><p class="note" style="margin:0 0 12px">Lo que envían los auxiliares de mina queda aquí hasta que lo revises. Puedes corregirlo antes de validarlo.</p>
 ${p.length?`<div class="bar" style="margin-bottom:10px"><button class="btn sm pri edit-only" data-act="valAll">${ic('ok')}Validar todo (${p.length})</button></div>`+p.map(({c,r})=>{const m=mqById(mqOf(r));const t=c==='rh'?(enCurso(r)?'Jornada en curso · inicio '+f1(r.hi):r.horas>0?`Jornada ${f1(r.hi)} → ${f1(r.hf)} · ${f1(r.horas)} h`:'Novedad'):c==='rs'?`${r.tipo}: ${r.concepto} · ${fmt(r.valor)}`:`${r.tipo} ${r.cant?f1(r.cant)+' gal':''} · ${fmt(r.valor)}`;
  const fotos=['','2','3'].filter(x=>r['foto'+x]).map(x=>`<button class="ib" data-act="foto" data-id="${esc(r['foto'+x])}"${r['fotoDrive'+x]?` data-drive="${esc(r['fotoDrive'+x])}"`:''} title="Ver foto">${ic('cam')}</button>`).join('');
  return `<div class="vrow"><div style="min-width:0;flex:1"><b>${esc(m.maq)}</b> · ${fdl(r.fecha)}<div>${esc(t)}</div>${r.obs?`<div class="mut" style="font-size:13px">${esc(r.obs)}</div>`:''}</div><div class="acts">${fotos}<button class="ib edit-only" data-act="edit" data-c="${c}" data-id="${r.id}" title="Corregir">${ic('edit')}</button><button class="btn sm pri edit-only" data-act="valOne" data-c="${c}" data-id="${r.id}">${ic('ok')}Validar</button></div></div>`}).join(''):'<div class="al ok"><i></i><div>Todo validado.</div></div>'}</div>`;
}
Object.assign(ACT,{
 wz:()=>wzStart('jor'),wzNov:()=>wzStart('nov'),wzRs:()=>wzStart('rs'),wzRc:()=>wzStart('rc'),
 wzNext:()=>{wzRead();const st=WZ.steps[WZ.i];if(st==='novq'&&WZ.d.hasNov==null){toast('Toca Sí o No');return}if(st!=='novq'&&!wzCheck())return;WZ.i++;wzRender()},
 wzBack:()=>{wzRead();WZ.i=Math.max(0,WZ.i-1);wzRender()},
 wzSave:()=>{wzRead();wzSave()},
 wzSet:d=>{wzRead();WZ.d[d.k]=d.v;if(d.k==='hasNov'){if(d.v==='1'){if(!WZ.steps.includes('nov'))WZ.steps.splice(WZ.i+1,0,'nov')}else{WZ.steps=WZ.steps.filter(s=>s!=='nov');WZ.d.txt=''}WZ.i++}else if(d.k==='fnd'||d.k==='tipo')WZ.i++;wzRender()},
 wzAdd:d=>{wzRead();WZ.d.txt=WZ.d.txt?(WZ.d.txt.includes(d.v)?WZ.d.txt:WZ.d.txt+', '+d.v):d.v;wzRender()},
 cMis:()=>vMis(),goAj:()=>go('ajustes'),
 cmSel:()=>{const l=mqList().filter(m=>!m.inactivo);if(l.length<2)return;$('#sheet').classList.remove('wide');$('#sheet').innerHTML=`<div class="sh"><h2>¿Con qué máquina?</h2><button class="ib" data-act="close">${ic('x')}</button></div><div class="sbd">${l.map(m=>`<button class="rl" data-act="cmPick" data-id="${m.id}"><span class="avatar" style="width:44px;height:44px">${mqImg(m)}</span><span class="t"><b>${esc(m.maq)}</b><small>${esc(m.tipo||'')}</small></span></button>`).join('')}</div>`;$('#modal').hidden=false;hydrate($('#sheet'))},
 cmPick:d=>{V.cm=d.id;S.cfg.mqDef=d.id;save();closeModal();render()},
 valOne:d=>{upsert(d.c,{id:d.id,val:true});render();toast('Validado')},
 valAll:()=>{const p=pendVal();confirmBox('¿Validar todo?',`Se marcan ${p.length} registros como revisados.`,()=>{p.forEach(({c,r})=>upsert(c,{id:r.id,val:true}));render();toast('Registros validados')})}
});
{const c0=closeModal;closeModal=function(){$('#sheet').classList.remove('wzs');return c0()}}
/* ---- alerta de validación para el administrador ---- */
{const a0=alerts;alerts=function(){const a=a0();const n=pendVal().length;if(n&&S.cfg.role==='admin')a.unshift(['',`${n} registro${n===1?'':'s'} de los auxiliares de mina por validar.`]);return a}}
/* ---- invitaciones por rol y modo local/Drive ---- */
function invLink(tok,mq){const h=new URLSearchParams({u:S.cfg.url,k:tok});if(mq)h.set('m',mq);return location.href.split('#')[0]+'#conectar&'+h.toString()}
async function invitar(){
 if(!S.cfg.url||S.cfg.tokRole!=='admin'){toast('Primero conecta esta app al Drive con la clave de administrador');return}
 if(!navigator.onLine){toast('Se necesita señal para generar las invitaciones');return}
 let j;try{j=await api('keys')}catch(e){toast(e.message);return}
 const ms=mqList().filter(m=>!m.inactivo);
 const card=(rol,lab,desc,tok)=>`<div class="inv"><b>${lab}</b><small class="mut">${desc}</small>${rol==='aux'&&ms.length?`<div class="fld" style="margin-top:8px"><label for="invM">Máquina que maneja</label><select id="invM" data-act-change="invM"><option value="">Todas</option>${ms.map(m=>`<option value="${m.id}">${esc(m.maq)}</option>`).join('')}</select></div>`:''}<div class="bar" style="margin-top:10px"><button class="btn sm pri" data-act="invWa" data-r="${rol}">${ic('send')}WhatsApp</button><button class="btn sm gh" data-act="invCp" data-r="${rol}">${ic('copy')}Copiar enlace</button><button class="btn sm gh" data-act="invQr" data-r="${rol}">QR</button></div><div class="qr" id="qr_${rol}"></div></div>`;
 window.__KEYS=j.keys||{};
 $('#sheet').classList.add('wide');
 $('#sheet').innerHTML=`<div class="sh"><h2>Invitar personas</h2><button class="ib" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="sbd"><p class="note" style="margin:0 0 12px">Cada persona abre su enlace (o escanea el QR) en su celular o PC: la app queda conectada con su perfil. Luego la instala en la pantalla de inicio.</p><div class="grid inv-g">
 ${card('aux','Auxiliar de mina','Registra jornadas, novedades, repuestos y combustible con botones grandes. No borra.')}
 ${card('conta','Dueño','Ve el panel, las máquinas y los informes. No modifica nada.')}
 ${card('admin','Administrador de la app','Todo: valida lo que envían los auxiliares, corrige y genera informes.')}</div></div>`;
 $('#modal').hidden=false;
}
const invUrl=r=>invLink((window.__KEYS||{})[r]||'',r==='aux'?($('#invM')?.value||''):'');
const invMsg=r=>`Hola. Este es tu acceso al Tablero de Maquinaria como ${ROLES[r]}.\n1. Abre este enlace en tu celular: ${invUrl(r)}\n2. Instálala: en iPhone, Safari → Compartir → Agregar a inicio. En Android, Chrome → ⋮ → Instalar aplicación.\nFunciona sin señal: lo que registres se envía cuando haya internet.`;
Object.assign(ACT,{
 invitar:()=>invitar(),
 invWa:d=>{window.open('https://wa.me/?text='+encodeURIComponent(invMsg(d.r)),'_blank','noopener')},
 invCp:d=>copyText(invMsg(d.r)),
 invQr:async d=>{const box=$('#qr_'+d.r);try{await loadJs('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');const q=qrcode(0,'M');q.addData(invUrl(d.r));q.make();box.innerHTML=q.createSvgTag({cellSize:5,margin:2,scalable:true});box.style.display='block'}catch(e){toast('Se necesita señal para generar el QR')}},
 modoLocal:()=>confirmBox('¿Usar solo este equipo?','La información queda guardada en este equipo. Puedes conectar el Drive cuando quieras; lo guardado se envía completo.',()=>{S.cfg.url='';S.cfg.token='';S.cfg.tokRole='';S.cfg.modo='local';save();render();toast('Modo: solo este equipo')}),
 modoDrive:()=>{S.cfg.modo='drive';save();render();setTimeout(()=>$('#surl')?.focus(),80)}
});
function connectFromHash(){const h=location.hash||'';if(!h.startsWith('#conectar'))return false;const p=new URLSearchParams(h.replace(/^#conectar&?/,''));const u=p.get('u'),k=p.get('k'),m=p.get('m');try{history.replaceState(null,'',location.pathname)}catch(e){}
 if(!u||!k||!/^(https:\/\/script\.google\.com\/|http:\/\/localhost[:\/])/.test(u)){toast('Enlace de invitación no válido');return false}
 S.cfg.url=u;S.cfg.token=k;S.cfg.tokRole='';S.cfg.scopeUrl='';S.cfg.pushedAll='';S.cfg.modo='drive';if(m)S.cfg.mqDef=m;save();
 setTimeout(async()=>{await sync(true);if(S.cfg.tokRole){S.cfg.role=S.cfg.tokRole;save();go(S.cfg.role==='aux'?'campo':'inicio');toast('Conectado como '+ROLES[S.cfg.role]+'. Ahora instala la app en la pantalla de inicio.')}},300);return true}
function storeCard(){const c=S.cfg;const drive=!!c.url||c.modo==='drive';if(c.url&&c.tokRole&&c.tokRole!=='admin')return '';
 return `<div class="card"><h3>¿Dónde se guarda la información?</h3><div class="grid two st2">
 <button class="stc ${!drive?'on':''}" data-act="modoLocal"><b>Solo en este equipo</b><small>Sin cuentas ni internet. Usa “Copia de seguridad” para respaldar o pasar los datos a otro equipo.</small></button>
 <button class="stc ${drive?'on':''}" data-act="modoDrive"><b>Google Drive</b><small>Varios equipos comparten la información. Fotos, soportes e informes quedan en una carpeta del Drive y los datos en un Sheet.</small></button></div>
 ${c.tokRole==='admin'?`<div class="bar" style="margin-top:12px"><button class="btn pri" data-act="invitar">${ic('link')}Invitar personas: auxiliares de mina y dueño</button></div>`:drive&&!c.url?'<p class="note" style="margin:12px 0 0">Pega abajo el enlace del servicio y tu clave, o abre el enlace de invitación que te enviaron.</p>':''}</div>`}
{const ml=ACT.modoLocal;ACT.modoLocal=()=>{if(!S.cfg.url){S.cfg.modo='local';save();render();toast('Modo: solo este equipo');return}ml()}}

/* ---------- arranque ---------- */
(async()=>{
 await DB.open();
 let st=null;try{st=await DB.get('kv','state')}catch(e){}
 S=st&&st.cfg?st:seed();
 migrate();
 if(!DB.db)setTimeout(()=>toast('Este navegador no permite guardar datos: lo que registres se perderá al cerrar. Usa la app instalada o un navegador normal.'),1200);
 if(!st)DB.put('kv','state',S);
 const h=(location.hash||'').slice(1).split('.');
 const inv=connectFromHash();
 if(!inv&&h[0]&&modOf(h[0]))go(h[0],h[1]);else if(S.cfg.role==='aux')go('campo');else render();
 if(!inv&&navigator.onLine&&S.cfg.url&&S.cfg.token)setTimeout(()=>sync(false),1500);
 dlNs();
})();
</script>
